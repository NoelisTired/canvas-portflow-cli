<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#141b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#22c8a0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2740"/>
      <stop offset="1" stop-color="#172036"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>

  <!-- faint concentric rings, abstract -->
  <g stroke="#ffffff" stroke-opacity="0.04" fill="none">
    <circle cx="1040" cy="210" r="150"/>
    <circle cx="1040" cy="210" r="110"/>
    <circle cx="1040" cy="210" r="70"/>
  </g>

  <!-- LEFT: stacked document folders (the local project) -->
  <g transform="translate(150,120)">
    <g>
      <rect x="20" y="36" width="150" height="110" rx="12" fill="url(#card)" stroke="#2c3a5a" stroke-width="1.5" opacity="0.55"/>
      <rect x="10" y="20" width="150" height="110" rx="12" fill="url(#card)" stroke="#2c3a5a" stroke-width="1.5" opacity="0.8"/>
      <rect x="0" y="4" width="150" height="110" rx="12" fill="url(#card)" stroke="#36476b" stroke-width="1.5"/>
      <!-- folder tab -->
      <path d="M0 24 v-8 a8 8 0 0 1 8 -8 h34 l10 12 h-52 z" fill="#36476b"/>
      <!-- lines = documents -->
      <rect x="22" y="38" width="90" height="7" rx="3.5" fill="#5b9bff" opacity="0.85"/>
      <rect x="22" y="56" width="106" height="6" rx="3" fill="#43557d"/>
      <rect x="22" y="72" width="70" height="6" rx="3" fill="#43557d"/>
      <rect x="22" y="88" width="96" height="6" rx="3" fill="#43557d"/>
    </g>
    <text x="75" y="150" text-anchor="middle" font-size="15" fill="#8795b5">jouw documenten</text>
  </g>

  <!-- MIDDLE: flow arrow with a node -->
  <g transform="translate(420,174)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="url(#accent)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="150" cy="0" r="26" fill="#141b2e" stroke="url(#accent)" stroke-width="3"/>
    <path d="M142 -8 l12 8 l-12 8 z" fill="#22c8a0"/>
    <text x="150" y="54" text-anchor="middle" font-size="14" fill="#8795b5">sync</text>
    <path d="M296 -7 l10 7 l-10 7 z" fill="#22c8a0"/>
  </g>

  <!-- RIGHT: the portfolio (rings + document cards with a link) -->
  <g transform="translate(960,120)">
    <rect x="0" y="4" width="170" height="150" rx="16" fill="url(#card)" stroke="#36476b" stroke-width="1.6"/>
    <rect x="18" y="26" width="134" height="9" rx="4.5" fill="#22c8a0" opacity="0.9"/>
    <rect x="18" y="48" width="110" height="7" rx="3.5" fill="#43557d"/>
    <!-- a linked reference row -->
    <circle cx="24" cy="76" r="5" fill="#5b9bff"/>
    <rect x="38" y="72" width="96" height="7" rx="3.5" fill="#5b9bff" opacity="0.6"/>
    <circle cx="24" cy="98" r="5" fill="#5b9bff"/>
    <rect x="38" y="94" width="80" height="7" rx="3.5" fill="#5b9bff" opacity="0.6"/>
    <rect x="18" y="118" width="124" height="7" rx="3.5" fill="#43557d"/>
    <text x="85" y="150" text-anchor="middle" font-size="15" fill="#8795b5" transform="translate(0,22)">je portfolio</text>
  </g>

  <!-- title + tagline -->
  <text x="640" y="350" text-anchor="middle" font-size="40" font-weight="700" fill="url(#accent)" letter-spacing="0.5">Canvas Portfolio CLI</text>
  <text x="640" y="384" text-anchor="middle" font-size="17" fill="#8795b5">documenten uit een map, netjes in je Portflow-portfolio</text>
</svg>
