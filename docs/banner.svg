<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="c_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1322"/><stop offset="1" stop-color="#121a30"/>
    </linearGradient>
    <linearGradient id="c_acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b9bff"/><stop offset="1" stop-color="#2fd0a6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" fill="url(#c_bg)"/>

  <!-- large offset rings, very subtle, cropped -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05">
    <circle cx="1180" cy="60" r="220" stroke-width="40"/>
    <circle cx="90" cy="380" r="160" stroke-width="30"/>
  </g>

  <!-- the mark: a stack of three sheets with a connecting line, left of the text -->
  <g transform="translate(250,150)">
    <rect x="22" y="22" width="78" height="100" rx="10" fill="#1a2742" opacity="0.5"/>
    <rect x="11" y="11" width="78" height="100" rx="10" fill="#1d2c4a" opacity="0.75"/>
    <rect x="0" y="0" width="78" height="100" rx="10" fill="#21304f" stroke="#38507d" stroke-width="1.5"/>
    <rect x="14" y="18" width="40" height="7" rx="3.5" fill="url(#c_acc)"/>
    <rect x="14" y="34" width="50" height="5" rx="2.5" fill="#43557d"/>
    <rect x="14" y="46" width="34" height="5" rx="2.5" fill="#43557d"/>
    <!-- link dot -->
    <circle cx="19" cy="66" r="4" fill="#5b9bff"/>
    <rect x="28" y="63" width="42" height="5" rx="2.5" fill="#5b9bff" opacity="0.65"/>
    <circle cx="19" cy="82" r="4" fill="#5b9bff"/>
    <rect x="28" y="79" width="30" height="5" rx="2.5" fill="#5b9bff" opacity="0.65"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(400,0)">
    <text x="0" y="200" font-size="58" font-weight="800" fill="#eef2fb" letter-spacing="-0.5">Canvas Portfolio <tspan fill="url(#c_acc)">CLI</tspan></text>
    <text x="3" y="244" font-size="20" fill="#8291b2">documenten uit een map, met klikbare links, in je Portflow-portfolio</text>
    <!-- accent underline -->
    <rect x="3" y="214" width="150" height="4" rx="2" fill="url(#c_acc)"/>
  </g>
</svg>
